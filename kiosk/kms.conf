Section "Device"
    Identifier "Raspberry Pi KMS"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier "HDMI television"
EndSection

Section "Screen"
    Identifier "Kiosk screen"
    Device "Raspberry Pi KMS"
    Monitor "HDMI television"
    DefaultDepth 24
EndSection

Section "ServerLayout"
    Identifier "Kiosk layout"
    Screen "Kiosk screen"
EndSection
